name: BFME II admission after an unmeasured check

# A compiler check that claimed its reservation and measured nothing (a machine fault) sends bfme-unmeasured with its
# pull request number and its own run id. Admission may re-issue that reservation only once the run has completed
# and been quiet for 120 seconds, so this waits for exactly that, then asks admission to decide for the pull request
# (admit.py request; it re-checks everything itself and re-issues at most twice per commit per main). No checkout,
# no pull request content. Started only by the Actions bot.
on:
  repository_dispatch:
    types: [bfme-unmeasured]

permissions: {}

jobs:
  wait-then-ask:
    if: >-
      github.repository_id == '1464323350' && github.ref == 'refs/heads/main' && github.actor_id == '41898282'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: bfme-unmeasured-${{ github.event.client_payload.run }}
      cancel-in-progress: false
    permissions:
      actions: read
      contents: write
    steps:
      - name: Wait for the check run to complete and settle, then ask admission
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.client_payload.number }}
          RUN: ${{ github.event.client_payload.run }}
        run: |
          set -euo pipefail
          if [[ ! "$NUMBER" =~ ^[1-9][0-9]{0,8}$ || ! "$RUN" =~ ^[1-9][0-9]{0,19}$ ]]; then
            echo "Expected one pull request number and one run id. Found something else." >&2
            exit 1
          fi
          state=""
          for _ in $(seq 1 75); do                       # at most 25 minutes
            state=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN" --jq '.status' || true)
            [[ "$state" == completed ]] && break
            sleep 20
          done
          if [[ "$state" != completed ]]; then
            echo "The check run $RUN did not complete in time; the hourly admission run will retry it." >&2
            exit 0
          fi
          sleep 150                                     # admission requires 120 s of quiet after the run ended
          jq -n --argjson number "$NUMBER" '{event_type: "bfme-admit-request", client_payload: {number: $number}}' |
            gh api --method POST "repos/$GITHUB_REPOSITORY/dispatches" --input - >/dev/null
