name: BFME II source rules

on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review, edited]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Exact archived NT2 pull request number
        required: true
        type: string
      base_sha:
        description: Exact canary/nt2-base commit
        required: true
        type: string
      head_sha:
        description: Exact unmodified NT2 author head
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read
  statuses: write

jobs:
  source-rules:
    if: github.ref == 'refs/heads/main'
    runs-on: boat-small/from=bfme2-compiler-v1
    timeout-minutes: 15
    concurrency:
      group: bfme-source-rules-${{ github.event.pull_request.number || inputs.pr_number }}
      cancel-in-progress: true
    outputs:
      receipt: ${{ steps.publish.outputs.receipt }}
    env:
      ARCHIVE_PR: ${{ inputs.pr_number }}
      ARCHIVE_BASE: ${{ inputs.base_sha }}
      ARCHIVE_HEAD: ${{ inputs.head_sha }}
    steps:
      - name: Load the source checks from protected main
        id: trusted
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: tools/gates
          path: source-rule-tools

      - name: Fetch protected main and the exact author head into a bare store
        if: steps.trusted.outcome == 'success'
        id: fetch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -I -S -B source-rule-tools/tools/gates/workflow.py fetch

      - name: Evaluate the source rules without credentials
        if: always() && !cancelled() && steps.trusted.outcome == 'success'
        id: evaluate
        shell: bash
        env:
          SOURCE_OBJECTS: ${{ steps.fetch.outputs.scratch }}
          FETCH_REASON: ${{ steps.fetch.outputs.reason }}
        run: |
          env -i PATH=/usr/bin:/bin HOME="$HOME" \
            GITHUB_REPOSITORY="$GITHUB_REPOSITORY" GITHUB_REPOSITORY_ID="$GITHUB_REPOSITORY_ID" \
            GITHUB_REF="$GITHUB_REF" GITHUB_SHA="$GITHUB_SHA" GITHUB_EVENT_NAME="$GITHUB_EVENT_NAME" \
            GITHUB_EVENT_PATH="$GITHUB_EVENT_PATH" GITHUB_API_URL="$GITHUB_API_URL" \
            GITHUB_SERVER_URL="$GITHUB_SERVER_URL" GITHUB_OUTPUT="$GITHUB_OUTPUT" \
            GITHUB_STEP_SUMMARY="$GITHUB_STEP_SUMMARY" SOURCE_OBJECTS="$SOURCE_OBJECTS" \
            FETCH_REASON="$FETCH_REASON" ARCHIVE_PR="$ARCHIVE_PR" \
            ARCHIVE_BASE="$ARCHIVE_BASE" ARCHIVE_HEAD="$ARCHIVE_HEAD" \
            python3 -I -S -B source-rule-tools/tools/gates/workflow.py evaluate

      - name: Recheck current main and publish source-rule statuses
        if: always() && !cancelled() && steps.trusted.outcome == 'success'
        id: publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RULE_STATUS: ${{ steps.evaluate.outputs.status }}
        run: python3 -I -S -B source-rule-tools/tools/gates/workflow.py publish

      - name: Report unavailable protected tools
        if: always() && !cancelled() && steps.trusted.outcome != 'success'
        shell: bash
        run: |
          {
            printf '| Rule | Result |\n| --- | --- |\n'
            for rule in 'G1 Paths' 'G2 Generated annotations' 'G3 Forbidden constructs' \
              'G4 Stand-in types' 'G5 Comments' 'G6 One item' 'G7 One definition' 'G8 Address names'; do
              printf '| %s | Error |\n' "$rule"
            done
            printf '\n**Binding [tools-unavailable]** The protected source check could not be loaded from this main revision.\n'
          } >> "$GITHUB_STEP_SUMMARY"
