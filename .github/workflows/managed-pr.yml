    if: always() && !cancelled() && needs.intake.result != 'skipped' && (vars.BFME_PR_COMPACT == 'yes' || (needs.wide-plan.result != 'success' || needs.wide-join.outputs.complete == 'true'))
    name: Report on the pull request head
