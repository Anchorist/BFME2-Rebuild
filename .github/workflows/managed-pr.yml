          MANAGED_PUBLIC_REPORT: '${{ runner.temp }}/bfme-report'
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; printf "Expected protected workflow step to finish. Found exit %s at shell line %s.\n" "$rc" "$LINENO" >&2' ERR
