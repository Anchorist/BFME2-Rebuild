          path: '${{ runner.temp }}/lease.json'
          if-no-files-found: error
          retention-days: 1
      - name: Collect exact leased results before the deadline
        shell: bash
        if: steps.freeze.outputs.reserve_needed == 'true'
        env:
          PLAN_SHA: '${{ needs.wide-plan.outputs.matrix_sha }}'
          STARTED: '${{ needs.wide-plan.outputs.started }}'
