              "$RUNNER_TEMP/lease.json" "$LEASE_SHA"
      - name: Save complete capped comparison
        id: verdict
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfme-verdict-wide-fallback-${{ github.run_attempt }}
