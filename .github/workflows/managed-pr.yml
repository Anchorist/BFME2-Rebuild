name: BFME II Boat comparison

on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review, labeled, unlabeled, edited]

  repository_dispatch:
    types: [bfme-remeasure]

permissions: {}

concurrency:
  group: >-
    managed-pr-${{ github.event_name == 'repository_dispatch' && 'dispatch' || github.event.pull_request.number }}-${{
      github.event_name == 'repository_dispatch' && github.run_id ||
      ((github.event.action == 'edited' && github.event.changes.base.ref.from == '') ||
        ((github.event.action == 'labeled' || github.event.action == 'unlabeled') &&
          github.event.label.name != 'boat-ok')) && github.run_id || 'active' }}
  cancel-in-progress: true

jobs:
  pending:
    if: >-
      vars.BFME_PR_COMPACT != 'yes' &&
      github.repository_id == '1464323350' && github.ref == 'refs/heads/main' &&
      github.repository == 'Open-BFME/BFME2-Rebuild' &&
      (github.event.action != 'edited' || github.event.changes.base.ref.from != '') &&
      ((github.event.action != 'labeled' && github.event.action != 'unlabeled') ||
        github.event.label.name == 'boat-ok')
    name: Start exact-head status
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    steps:
      - name: Check out protected status writer
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: '${{ github.sha }}'
          persist-credentials: false
          sparse-checkout: |
            ci/managed-check
            ci/managed-nt2
      - name: Start exact-head status
        shell: bash
        env:
          BFME_STATUS_TOKEN: '${{ github.token }}'
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; printf "Expected protected workflow step to finish. Found exit %s at shell line %s.\n" "$rc" "$LINENO" >&2' ERR
          (cd ci/managed-check && sha256sum -c --quiet bundle.sha256)
          python3 -B ci/managed-check/github_io.py start

  intake:
    if: >-
      github.repository_id == '1464323350' && github.ref == 'refs/heads/main' &&
      github.repository == 'Open-BFME/BFME2-Rebuild' &&
      (github.event.action != 'edited' || github.event.changes.base.ref.from != '') &&
      ((github.event.action != 'labeled' && github.event.action != 'unlabeled') ||
        github.event.label.name == 'boat-ok')
    name: Protected source intake
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    outputs:
      route: '${{ steps.plan.outputs.route }}'
      source_decision: '${{ steps.evaluate.outputs.status }}'
    steps:
      - name: Check out protected main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: '${{ github.sha }}'
          fetch-depth: 1
          persist-credentials: false
      - name: Verify protected check package
        shell: bash
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; printf "Expected protected workflow step to finish. Found exit %s at shell line %s.\n" "$rc" "$LINENO" >&2' ERR
          (cd ci/managed-check && sha256sum -c --quiet bundle.sha256)
          (cd ci/managed-nt2 && sha256sum -c --quiet bundle.sha256)
      - name: Start exact-head status
        if: vars.BFME_PR_COMPACT == 'yes'
        shell: bash
        env:
          BFME_STATUS_TOKEN: '${{ github.token }}'
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; printf "Expected protected workflow step to finish. Found exit %s at shell line %s.\n" "$rc" "$LINENO" >&2' ERR
          (cd ci/managed-check && sha256sum -c --quiet bundle.sha256)
          python3 -B ci/managed-check/github_io.py start
      - name: Check the current pull request and read its admission
        shell: bash
        env:
          BFME_READ_TOKEN: '${{ github.token }}'
          BFME_MANAGED_STARTER: ${{ ((github.actor_id == '1760627' || (github.actor_id == '41898282' && github.event_name == 'repository_dispatch')) && (github.triggering_actor == 'Ancalgonn' || github.triggering_actor == 'github-actions[bot]')) && 'yes' || 'no' }}
        run: |
          set -Eeuo pipefail
          python3 -B ci/managed-check/github_io.py bind "$RUNNER_TEMP/bfme-receive"
          if [[ "$BFME_MANAGED_STARTER" != yes ]]; then
            binding="$RUNNER_TEMP/bfme-receive/event.json"
            jq -e '.approved = false' "$binding" > "$binding.checked"
            mv -- "$binding.checked" "$binding"
          fi
      - name: Receive exact public Git objects without a credential
        shell: bash
        run: |
          set -Eeuo pipefail
          env -i PATH=/usr/bin:/bin HOME="$HOME" LANG=C LC_ALL=C TMPDIR="$RUNNER_TEMP" \
            python3 -B ci/managed-check/github_io.py fetch "$RUNNER_TEMP/bfme-receive"
      - name: Validate source and determine affected files
        id: plan
        shell: bash
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; printf "Expected protected workflow step to finish. Found exit %s at shell line %s.\n" "$rc" "$LINENO" >&2' ERR
          env -i PATH=/usr/bin:/bin HOME="$HOME" LANG=C LC_ALL=C \
            GITHUB_OUTPUT="$GITHUB_OUTPUT" TMPDIR="$RUNNER_TEMP" \
            python3 -B ci/managed-check/intake.py "$RUNNER_TEMP/bfme-receive" "$RUNNER_TEMP/bfme-plan"
      - name: Save protected source decision
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfme-plan-${{ github.run_attempt }}
          path: '${{ runner.temp }}/bfme-plan'
          if-no-files-found: error
          retention-days: 1
      - name: Save source-free admission decision
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfme-admission-status-${{ github.run_attempt }}
          path: '${{ runner.temp }}/bfme-plan/decision.json'
          if-no-files-found: error
          retention-days: 1
      - name: Confirm the current change and repository visibility
        id: authorize
        if: vars.BFME_PR_COMPACT == 'yes'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -I -S -B tools/gates/workflow.py authorize
      - name: Fetch public Git objects without credentials
        if: steps.authorize.outputs.transport == 'public'
        id: fetch-public
        shell: bash
        run: |
          env -i PATH=/usr/bin:/bin HOME="$HOME" RUNNER_TEMP="$RUNNER_TEMP" \
            GITHUB_REPOSITORY="$GITHUB_REPOSITORY" GITHUB_REPOSITORY_ID="$GITHUB_REPOSITORY_ID" \
            GITHUB_REF="$GITHUB_REF" GITHUB_SHA="$GITHUB_SHA" GITHUB_EVENT_NAME="$GITHUB_EVENT_NAME" \
            GITHUB_EVENT_PATH="$GITHUB_EVENT_PATH" GITHUB_API_URL="$GITHUB_API_URL" \
            GITHUB_SERVER_URL="$GITHUB_SERVER_URL" GITHUB_OUTPUT="$GITHUB_OUTPUT" \
            SOURCE_TRANSPORT=public \
            python3 -I -S -B tools/gates/workflow.py fetch
      - name: Receive same-repository changes in the private repository
        if: steps.authorize.outputs.transport == 'private'
        id: fetch-private
        shell: bash
        env:
          SOURCE_TRANSPORT: private
          GH_TOKEN: ${{ github.token }}
        run: python3 -I -S -B tools/gates/workflow.py fetch
      - name: Evaluate the source rules without credentials
        if: always() && !cancelled() && vars.BFME_PR_COMPACT == 'yes' && steps.plan.outcome == 'success'
        id: evaluate
        shell: bash
        env:
          SOURCE_OBJECTS: ${{ steps.fetch-public.outputs.scratch || steps.fetch-private.outputs.scratch }}
          FETCH_REASON: ${{ steps.authorize.outputs.reason || steps.fetch-public.outputs.reason || steps.fetch-private.outputs.reason }}
        run: |
          env -i PATH=/usr/bin:/bin HOME="$HOME" \
            GITHUB_REPOSITORY="$GITHUB_REPOSITORY" GITHUB_REPOSITORY_ID="$GITHUB_REPOSITORY_ID" \
            GITHUB_REF="$GITHUB_REF" GITHUB_SHA="$GITHUB_SHA" GITHUB_EVENT_NAME="$GITHUB_EVENT_NAME" \
            GITHUB_EVENT_PATH="$GITHUB_EVENT_PATH" GITHUB_API_URL="$GITHUB_API_URL" \
            GITHUB_SERVER_URL="$GITHUB_SERVER_URL" GITHUB_OUTPUT="$GITHUB_OUTPUT" \
            GITHUB_STEP_SUMMARY="$GITHUB_STEP_SUMMARY" SOURCE_OBJECTS="$SOURCE_OBJECTS" \
            FETCH_REASON="$FETCH_REASON" \
            python3 -I -S -B tools/gates/workflow.py evaluate

  compare:
    needs: [pending, intake]
    if: >-
      ((github.actor_id == '1760627' || (github.actor_id == '41898282' && github.event_name == 'repository_dispatch')) && (github.triggering_actor == 'Ancalgonn' || github.triggering_actor == 'github-actions[bot]')) &&
      (always() && !cancelled() && needs.intake.result == 'success' && (vars.BFME_PR_COMPACT == 'yes' || needs.pending.result == 'success') && needs.intake.outputs.route == 'compile')
    name: Isolated Boat compiler and native comparison
    runs-on: ${{ ((github.actor_id == '1760627' || (github.actor_id == '41898282' && github.event_name == 'repository_dispatch')) && (github.triggering_actor == 'Ancalgonn' || github.triggering_actor == 'github-actions[bot]')) && 'boat-small/from=bfme2-compiler-v1' || 'ubuntu-24.04' }}
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      inline_matrix_sha: '${{ steps.compile.outputs.inline_matrix_sha }}'
    steps:
      - name: Check out the same protected main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: '${{ github.sha }}'
          persist-credentials: false
      - name: Read protected source plan from this run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: bfme-plan-${{ github.run_attempt }}
          path: '${{ runner.temp }}/bfme-plan'
      - name: Verify image and comparison inputs
        shell: bash
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; printf "Expected protected workflow step to finish. Found exit %s at shell line %s.\n" "$rc" "$LINENO" >&2' ERR
          (cd ci/managed-check && sha256sum -c --quiet bundle.sha256)
          (
            cd ci/managed-nt2
            sha256sum -c --quiet bundle.sha256
            got=$(printf '%s\n' '?f@X@@QAEHXZ' | engine/gen/bin/demangle)
            test "$got" = 'public: int __thiscall X::f(void)'
          )
          cd /opt/boat-compiler
          sudo -n sha256sum -c --quiet input.sha256 runtime-files.sha256
          sudo -n systemd-tmpfiles --create /etc/tmpfiles.d/boat-compiler.conf
      - name: Compile admitted source and compare exact pairs
        id: compile
        shell: bash
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; printf "Expected protected workflow step to finish. Found exit %s at shell line %s.\n" "$rc" "$LINENO" >&2' ERR
          test -z "${BFME_READ_TOKEN:-}${BFME_STATUS_TOKEN:-}${GITHUB_TOKEN:-}"
          env -i PATH=/usr/bin:/bin HOME="$HOME" LANG=C LC_ALL=C \
            TMPDIR="$RUNNER_TEMP" GITHUB_SHA="$GITHUB_SHA" GITHUB_OUTPUT="$GITHUB_OUTPUT" \
            GITHUB_RUN_ID="$GITHUB_RUN_ID" GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" \
            BFME_INLINE_EXPORT="$RUNNER_TEMP/bfme-inline-narrow" \
            python3 -B ci/managed-check/compare.py "$RUNNER_TEMP/bfme-plan" "$RUNNER_TEMP/bfme-verdict"
      - name: Save capped structured verdict
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfme-verdict-${{ github.run_attempt }}
          path: '${{ runner.temp }}/bfme-verdict/verdict.json'
          if-no-files-found: error
          retention-days: 1

      - name: Save advisory narrow virtual evidence
        continue-on-error: true
        if: vars.BFME_PR_COMPACT != 'yes' && steps.compile.outputs.inline_matrix_sha != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfme-inline-narrow-${{ github.run_attempt }}
          path: '${{ runner.temp }}/bfme-inline-narrow'
          if-no-files-found: error
          retention-days: 1

      - name: Evaluate narrow inline virtual behaviour using this receipt
        if: vars.BFME_PR_COMPACT == 'yes' && steps.compile.outputs.inline_matrix_sha != ''
        id: narrow-inline
        continue-on-error: true
        env:
          NARROW_SHA: '${{ steps.compile.outputs.inline_matrix_sha }}'
        shell: bash
        run: |
          set -euo pipefail
          test -z "${BFME_READ_TOKEN:-}${BFME_STATUS_TOKEN:-}${GITHUB_TOKEN:-}"
          dir="$RUNNER_TEMP/bfme-inline-narrow"
          env -i PATH=/usr/bin:/bin HOME="$HOME" LANG=C LC_ALL=C TMPDIR="$RUNNER_TEMP" \
            GITHUB_SHA="$GITHUB_SHA" GITHUB_RUN_ID="$GITHUB_RUN_ID" GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" \
            GITHUB_STEP_SUMMARY="$GITHUB_STEP_SUMMARY" \
            python3 -B ci/managed-check/managed_inline_action.py "$RUNNER_TEMP/bfme-plan/plan.json" \
              "$dir/matrix.json" "$dir" "$NARROW_SHA" "$RUNNER_TEMP/bfme-inline-report"

      - name: Keep sanitized narrow inline outcome
        if: vars.BFME_PR_COMPACT == 'yes' && steps.narrow-inline.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfme-inline-report-${{ github.run_attempt }}
          path: '${{ runner.temp }}/bfme-inline-report'
          if-no-files-found: error
          retention-days: 1

  wide-plan:
    needs: [pending, intake]
    if: >-
      ((github.actor_id == '1760627' || (github.actor_id == '41898282' && github.event_name == 'repository_dispatch')) && (github.triggering_actor == 'Ancalgonn' || github.triggering_actor == 'github-actions[bot]')) &&
      (always() && !cancelled() && needs.intake.result == 'success' && (vars.BFME_PR_COMPACT == 'yes' || needs.pending.result == 'success') && needs.intake.outputs.route == 'wide')
    name: Plan the paired Boat matrix
    timeout-minutes: 5
    outputs:
      shards: '${{ steps.plan.outputs.shards }}'
      matrix_sha: '${{ steps.plan.outputs.matrix_sha }}'
      groups: '${{ steps.plan.outputs.groups }}'
      started: '${{ steps.clock.outputs.started }}'
      primary_cutoff: '${{ steps.clock.outputs.primary_cutoff }}'
      reserve_cutoff: '${{ steps.clock.outputs.reserve_cutoff }}'
    runs-on: ${{ ((github.actor_id == '1760627' || (github.actor_id == '41898282' && github.event_name == 'repository_dispatch')) && (github.triggering_actor == 'Ancalgonn' || github.triggering_actor == 'github-actions[bot]')) && 'boat-small/from=bfme2-compiler-v1' || 'ubuntu-24.04' }}
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out the same protected main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: '${{ github.sha }}'
          persist-credentials: false
      - name: Read this run's source-free recovery decision
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: bfme-admission-status-${{ github.run_attempt }}
          path: '${{ runner.temp }}/bfme-admission-status'
      - name: Read the protected source decision from this run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: bfme-plan-${{ github.run_attempt }}
          path: '${{ runner.temp }}/bfme-plan'
      - name: Verify protected comparison and sealed image
        shell: bash
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; printf "Expected protected workflow step to finish. Found exit %s at shell line %s.\n" "$rc" "$LINENO" >&2' ERR
          (cd ci/managed-check && sha256sum -c --quiet bundle.sha256)
          (cd ci/managed-nt2 && sha256sum -c --quiet bundle.sha256)
          cd /opt/boat-compiler
          sudo -n sha256sum -c --quiet input.sha256 runtime-files.sha256
          sudo -n systemd-tmpfiles --create /etc/tmpfiles.d/boat-compiler.conf
      - name: Set exact attempt recovery deadlines
        shell: bash
        id: clock
        env:
          BFME_RECOVERY_READ_TOKEN: '${{ github.token }}'
        run: |
          set -euo pipefail
          trap 'rc=$?; printf "Expected %s to finish; found exit %s at shell line %s.\n" "Set exact attempt recovery deadlines" "$rc" "$LINENO" >&2' ERR
          env -i PATH=/usr/bin:/bin HOME="$HOME" LANG=C LC_ALL=C \
            TMPDIR="$RUNNER_TEMP" GITHUB_SHA="$GITHUB_SHA" GITHUB_RUN_ID="$GITHUB_RUN_ID" \
            GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" GITHUB_OUTPUT="$GITHUB_OUTPUT" \
            GITHUB_REPOSITORY="$GITHUB_REPOSITORY" GITHUB_REPOSITORY_ID="$GITHUB_REPOSITORY_ID" \
            BFME_RECOVERY_READ_TOKEN="$BFME_RECOVERY_READ_TOKEN" \
            python3 -B ci/managed-check/recovery_broker.py clock "$RUNNER_TEMP/bfme-admission-status"
      - name: Create exact compile plan and shard assignments
        shell: bash
        id: plan
        env:
          MANAGED_WIDE_SHARDS: "${{ vars.BFME_WIDE_SHARDS || '24' }}"
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; printf "Expected protected workflow step to finish. Found exit %s at shell line %s.\n" "$rc" "$LINENO" >&2' ERR
          env -i PATH=/usr/bin:/bin HOME="$HOME" LANG=C LC_ALL=C \
            TMPDIR="$RUNNER_TEMP" GITHUB_SHA="$GITHUB_SHA" GITHUB_OUTPUT="$GITHUB_OUTPUT" MANAGED_WIDE_SHARDS="$MANAGED_WIDE_SHARDS" \
            python3 -B ci/managed-check/wide.py plan "$RUNNER_TEMP/bfme-plan" "$RUNNER_TEMP/bfme-matrix"
      - name: Save the protected paired plan
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfme-matrix-${{ github.run_attempt }}
          path: '${{ runner.temp }}/bfme-matrix/matrix.json'
          if-no-files-found: error
          retention-days: 1

  wide-compare:
    needs: wide-plan
    if: >-
      ((github.actor_id == '1760627' || (github.actor_id == '41898282' && github.event_name == 'repository_dispatch')) && (github.triggering_actor == 'Ancalgonn' || github.triggering_actor == 'github-actions[bot]')) &&
      (needs.wide-plan.result == 'success')
    name: Compare wide shard ${{ matrix.index }}
    continue-on-error: true
    timeout-minutes: 12
    strategy:
      fail-fast: false
      max-parallel: 32
      matrix:
        index: '${{ fromJSON(needs.wide-plan.outputs.shards) }}'
    runs-on: ${{ ((github.actor_id == '1760627' || (github.actor_id == '41898282' && github.event_name == 'repository_dispatch')) && (github.triggering_actor == 'Ancalgonn' || github.triggering_actor == 'github-actions[bot]')) && 'boat-small/from=bfme2-compiler-v1' || 'ubuntu-24.04' }}
    permissions:
      contents: read
    steps:
      - name: Check out the same protected main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: '${{ github.sha }}'
          persist-credentials: false
      - name: Read the protected source decision from this run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: bfme-plan-${{ github.run_attempt }}
          path: '${{ runner.temp }}/bfme-plan'
      - name: Read this run's exact compile assignments
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: bfme-matrix-${{ github.run_attempt }}
          path: '${{ runner.temp }}/bfme-matrix'
      - name: Verify protected comparison and sealed image
        shell: bash
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; printf "Expected protected workflow step to finish. Found exit %s at shell line %s.\n" "$rc" "$LINENO" >&2' ERR
          (cd ci/managed-check && sha256sum -c --quiet bundle.sha256)
          (cd ci/managed-nt2 && sha256sum -c --quiet bundle.sha256)
          cd /opt/boat-compiler
          sudo -n sha256sum -c --quiet input.sha256 runtime-files.sha256
          sudo -n systemd-tmpfiles --create /etc/tmpfiles.d/boat-compiler.conf
      - name: Compile paired primary group 0
        shell: bash
        id: group0
        env:
          PLAN_SHA: '${{ needs.wide-plan.outputs.matrix_sha }}'
          STARTED: '${{ needs.wide-plan.outputs.started }}'
          CUTOFF: '${{ needs.wide-plan.outputs.primary_cutoff }}'
          SHARD: '${{ matrix.index }}'
          PART: '0'
          GROUPS: '${{ needs.wide-plan.outputs.groups }}'
          TEST_DELAY: '${{ vars.BFME_RECOVERY_TEST_SHARD }}'
          TRUSTED_HEAD: '${{ github.event.pull_request.head.sha || github.event.client_payload.head }}'
        run: |
          set -euo pipefail
          trap 'rc=$?; printf "Expected %s to finish; found exit %s at shell line %s.\n" "Compile paired primary group 0" "$rc" "$LINENO" >&2' ERR
          if ! python3 -c 'import json,sys; raise SystemExit({"shard":int(sys.argv[1]),"part":int(sys.argv[2])} not in json.loads(sys.argv[3]))' "$SHARD" "$PART" "$GROUPS"; then
            exit 0
          fi
          left=$((CUTOFF - $(date -u +%s) - 5))
          if (( left <= 0 )); then exit 0; fi
          if [[ "$TRUSTED_HEAD" == a88a136a54c7f1456d7a670960ffcff0ee831f5e && "$TEST_DELAY" == "$SHARD" && "$PART" != 0 ]]; then
            echo "Protected delayed primary shard $SHARD group $PART waits for reassignment."
            sleep "$left"
            exit 0
          fi
          test -z "${BFME_RECOVERY_READ_TOKEN:-}${BFME_STATUS_TOKEN:-}${GITHUB_TOKEN:-}"
          rc=0
          timeout --kill-after=2 "$left" env -i PATH=/usr/bin:/bin HOME="$HOME" LANG=C LC_ALL=C \
            TMPDIR="$RUNNER_TEMP" GITHUB_SHA="$GITHUB_SHA" GITHUB_RUN_ID="$GITHUB_RUN_ID" \
            GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" python3 -B ci/managed-check/wide_recovery.py \
            compile "$RUNNER_TEMP/bfme-plan" "$RUNNER_TEMP/bfme-matrix" "$PLAN_SHA" "$SHARD" "$PART" \
            "$RUNNER_TEMP/bfme-paired-$PART" || rc=$?
          if (( rc == 124 || rc == 137 )); then
            echo "Primary shard $SHARD group $PART reached its deadline."
            exit 0
          fi
          (( rc == 0 ))
          echo "complete=true" >> "$GITHUB_OUTPUT"
      - name: Save paired primary checkpoint 0
        if: steps.group0.outputs.complete == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfme-recovery-primary-${{ github.run_attempt }}-${{ matrix.index }}-0
          path: '${{ runner.temp }}/bfme-paired-0/group.json'
          if-no-files-found: error
          retention-days: 1
      - name: Compile paired primary group 1
        shell: bash
        id: group1
        env:
          PLAN_SHA: '${{ needs.wide-plan.outputs.matrix_sha }}'
          STARTED: '${{ needs.wide-plan.outputs.started }}'
          CUTOFF: '${{ needs.wide-plan.outputs.primary_cutoff }}'
          SHARD: '${{ matrix.index }}'
          PART: '1'
          GROUPS: '${{ needs.wide-plan.outputs.groups }}'
          TEST_DELAY: '${{ vars.BFME_RECOVERY_TEST_SHARD }}'
          TRUSTED_HEAD: '${{ github.event.pull_request.head.sha || github.event.client_payload.head }}'
        run: |
          set -euo pipefail
          trap 'rc=$?; printf "Expected %s to finish; found exit %s at shell line %s.\n" "Compile paired primary group 1" "$rc" "$LINENO" >&2' ERR
