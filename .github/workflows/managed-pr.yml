        with:
          name: bfme-report-${{ github.run_attempt }}
          path: '${{ runner.temp }}/bfme-report'
          if-no-files-found: ignore
          retention-days: 7
      - name: Read this attempt's sanitized inline status
        id: receipt
        if: always() && !cancelled() && vars.BFME_PR_COMPACT == 'yes' && needs.intake.outputs.route == 'compile' && needs.compare.result == 'success'
        continue-on-error: true
