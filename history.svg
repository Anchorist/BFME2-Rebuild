<svg xmlns="http://www.w3.org/2000/svg" width="640" height="260" viewBox="0 0 640 260" role="img" aria-label="Progress over time, percent">
<style>
.bg{fill:#fcfcfb}.t1{fill:#0b0b0b}.t2{fill:#52514e}.track{fill:#e4e3df}.fill{fill:#2a78d6}
.grid{stroke:#e4e3df;stroke-width:1}.s1{stroke:#2a78d6}.s2{stroke:#eb6834}.s3{stroke:#1baf7a}.s4{stroke:#eda100}
.d1{fill:#2a78d6}.d2{fill:#eb6834}.d3{fill:#1baf7a}.d4{fill:#eda100}
@media (prefers-color-scheme: dark){.bg{fill:#1a1a19}.t1{fill:#f0efec}.t2{fill:#c3c2b7}.track{fill:#383835}
.fill{fill:#3987e5}.grid{stroke:#383835}.s1{stroke:#3987e5}.s2{stroke:#d95926}.s3{stroke:#199e70}.s4{stroke:#c98500}
.d1{fill:#3987e5}.d2{fill:#d95926}.d3{fill:#199e70}.d4{fill:#c98500}}
text{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}
</style>
<rect class="bg" width="640" height="260" rx="6"/>
<line class="grid" x1="44" x2="530" y1="224.0" y2="224.0"/>
<text class="t2" x="38" y="228.0" font-size="11" text-anchor="end">0%</text>
<line class="grid" x1="44" x2="530" y1="173.0" y2="173.0"/>
<text class="t2" x="38" y="177.0" font-size="11" text-anchor="end">25%</text>
<line class="grid" x1="44" x2="530" y1="122.0" y2="122.0"/>
<text class="t2" x="38" y="126.0" font-size="11" text-anchor="end">50%</text>
<line class="grid" x1="44" x2="530" y1="71.0" y2="71.0"/>
<text class="t2" x="38" y="75.0" font-size="11" text-anchor="end">75%</text>
<line class="grid" x1="44" x2="530" y1="20.0" y2="20.0"/>
<text class="t2" x="38" y="24.0" font-size="11" text-anchor="end">100%</text>
<text class="t2" x="287.0" y="122.0" font-size="13" text-anchor="middle">The chart starts once two main commits are measured.</text>
